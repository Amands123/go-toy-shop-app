name: CI

# Exclude the workflow to run on changes to the helm chart
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:

  # ── Job 1: Build & Test ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: 1.24

    - name: Download Dependencies
      run: go mod tidy

    - name: Build
      run: go build -o go-toy-shop

    - name: Test
      run: go test ./... -v -coverprofile=coverage.out

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.out

  # ── Job 2: Code Quality ────────────────────────────────────────────
  code-quality:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage-report

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Job 3: Build Docker Image ──────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false                       # ← build only, do not push yet
        load: true                        # ← load into local Docker daemon
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-toy-shop:${{ github.run_id }}

    - name: Save Docker image as tar
      run: |
        docker save ${{ secrets.DOCKERHUB_USERNAME }}/go-toy-shop:${{ github.run_id }} \
          -o go-toy-shop-image.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: go-toy-shop-image.tar

  # ── Job 4: Trivy Image Scan ────────────────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Docker image
      run: docker load -i go-toy-shop-image.tar

    - name: Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/go-toy-shop:${{ github.run_id }}
        format: table
        exit-code: 0                      # ← pipeline continues even if vulns found
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        output: trivy-report.txt

    - name: Upload Trivy scan report
      uses: actions/upload-artifact@v4
      if: always()                        # ← upload report even if scan finds issues
      with:
        name: trivy-report
        path: trivy-report.txt

  # ── Job 5: Push to DockerHub ───────────────────────────────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Docker image
      run: docker load -i go-toy-shop-image.tar

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push image to DockerHub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/go-toy-shop:${{ github.run_id }}

  # ── Job 6: Update Helm Chart ───────────────────────────────────────
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-toy-shop-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "agraman1994@gmail.com"
        git config --global user.name "Amands123"
        git add helm/go-toy-shop-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
      # ArgoCD detects this commit and auto-syncs the new image to the cluster